<svg xmlns="http://www.w3.org/2000/svg" width="900" height="304" viewBox="0 0 900 304" role="img" aria-label="Technical specification: Scope, Stack, and Operating Principles">
  <defs>
    <clipPath id="spec-clip-dark">
      <rect width="900" height="304" rx="3"/>
    </clipPath>
    <linearGradient id="spec-sheen-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101318"/>
      <stop offset="100%" stop-color="#0B0D10"/>
    </linearGradient>
    <filter id="spec-grain-dark" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <style>
    /* Mechanical Braun-style selector bar stepping 01 -> 02 -> 03 */
    .selector {
      animation: step-select 9s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    /* Subtle precision rail runner along top divider */
    .rail-runner {
      stroke-dasharray: 48 920;
      stroke-dashoffset: 968;
      animation: rail-glide 7s linear infinite;
    }
    /* Synchronized principle square cadence */
    .p-dot-1 { animation: dot-seq 9s ease-in-out 0s infinite; }
    .p-dot-2 { animation: dot-seq 9s ease-in-out 3s infinite; }
    .p-dot-3 { animation: dot-seq 9s ease-in-out 6s infinite; }

    @keyframes step-select {
      0%, 27%   { transform: translateY(0px); }
      33%, 60%  { transform: translateY(61px); }
      66%, 94%  { transform: translateY(122px); }
      100%      { transform: translateY(0px); }
    }
    @keyframes rail-glide {
      to { stroke-dashoffset: 0; }
    }
    @keyframes dot-seq {
      0%, 32%  { opacity: 1; }
      38%, 95% { opacity: 0.3; }
      100%     { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .selector, .rail-runner, .p-dot-1, .p-dot-2, .p-dot-3 {
        animation: none !important;
        transform: none !important;
        opacity: 1 !important;
      }
      .rail-runner { opacity: 0 !important; }
    }
  </style>

  <g clip-path="url(#spec-clip-dark)">
    <rect width="900" height="304" fill="url(#spec-sheen-dark)"/>
    <rect width="900" height="304" filter="url(#spec-grain-dark)" opacity="0.032"/>

    <!-- Top header rail & bottom principles rail -->
    <rect x="0" y="0" width="900" height="36" fill="#0F1216"/>
    <rect x="0" y="220" width="900" height="84" fill="#0F1216"/>

    <!-- Specular bevel -->
    <line x1="1" y1="1.5" x2="899" y2="1.5" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>

    <!-- Structural grid lines -->
    <line x1="0" y1="36.5" x2="900" y2="36.5" stroke="#23272F" stroke-width="1"/>
    <!-- Animated precision signal pulse gliding cleanly along the header hairline -->
    <line class="rail-runner" x1="0" y1="36.5" x2="900" y2="36.5" stroke="#FF4F00" stroke-width="1.2" opacity="0.85"/>

    <line x1="0" y1="220.5" x2="900" y2="220.5" stroke="#23272F" stroke-width="1"/>
    <line x1="450.5" y1="0" x2="450.5" y2="220" stroke="#23272F" stroke-width="1"/>

    <!-- Bottom 3-column dividers -->
    <line x1="300.5" y1="220" x2="300.5" y2="304" stroke="#23272F" stroke-width="1"/>
    <line x1="600.5" y1="220" x2="600.5" y2="304" stroke="#23272F" stroke-width="1"/>

    <!-- Top header labels -->
    <text x="28" y="22" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="500" fill="#F4F5F7">01 / scope</text>
    <text x="424" y="22" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#626975">operations</text>

    <text x="478" y="22" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="500" fill="#F4F5F7">02 / stack</text>
    <text x="872" y="22" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#626975">production</text>

    <!-- LEFT: 01 / Scope (3 clean rows + mechanical stepping datum bar) -->
    <rect class="selector" x="0" y="51" width="3" height="36" fill="#FF4F00"/>

    <line x1="28" y1="98.5" x2="424" y2="98.5" stroke="#191D24" stroke-width="1"/>
    <line x1="28" y1="159.5" x2="424" y2="159.5" stroke="#191D24" stroke-width="1"/>

    <text x="28" y="65" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#FF4F00">01</text>
    <text x="60" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#F4F5F7">Maintain</text>
    <text x="60" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9BA2AE">Bug fixes, updates, and reliable daily system uptime.</text>

    <text x="28" y="126" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#FF4F00">02</text>
    <text x="60" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#F4F5F7">Build</text>
    <text x="60" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9BA2AE">Web apps and backend services for hospital workflows.</text>

    <text x="28" y="187" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#FF4F00">03</text>
    <text x="60" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#F4F5F7">Report</text>
    <text x="60" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9BA2AE">Data pipelines and dashboards turning records into insight.</text>

    <!-- RIGHT: 02 / Stack (4 crisp tabular spec rows) -->
    <line x1="478" y1="82.5" x2="872" y2="82.5" stroke="#191D24" stroke-width="1"/>
    <line x1="478" y1="128.5" x2="872" y2="128.5" stroke="#191D24" stroke-width="1"/>
    <line x1="478" y1="174.5" x2="872" y2="174.5" stroke="#191D24" stroke-width="1"/>

    <text x="478" y="64" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#626975">backend</text>
    <text x="552" y="64" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#F4F5F7">Python / FastAPI / Flask / Node.js</text>

    <text x="478" y="110" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#626975">frontend</text>
    <text x="552" y="110" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#F4F5F7">TypeScript / JS / React / Next.js / Tailwind</text>

    <text x="478" y="156" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#626975">data</text>
    <text x="552" y="156" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#F4F5F7">PostgreSQL / MongoDB / Supabase</text>

    <text x="478" y="202" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#626975">infra</text>
    <text x="552" y="202" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#F4F5F7">Docker / Linux / Git / GitHub / VS Code</text>

    <!-- BOTTOM: 03 / Operating Principles (3 machined columns with synchronized cadence) -->
    <rect class="p-dot-1" x="28" y="241" width="5" height="5" fill="#FF4F00"/>
    <text x="41" y="247" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F4F5F7">Reliability first</text>
    <text x="28" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#9BA2AE">Hospital staff depend on these</text>
    <text x="28" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#9BA2AE">systems every single day.</text>

    <rect class="p-dot-2" x="328" y="241" width="5" height="5" fill="#FF4F00"/>
    <text x="341" y="247" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F4F5F7">Privacy by default</text>
    <text x="328" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#9BA2AE">No patient data in repositories,</text>
    <text x="328" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#9BA2AE">under any circumstance.</text>

    <rect class="p-dot-3" x="628" y="241" width="5" height="5" fill="#FF4F00"/>
    <text x="641" y="247" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F4F5F7">Reversible changes</text>
    <text x="628" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#9BA2AE">Small, reviewed, documented</text>
    <text x="628" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#9BA2AE">releases built for clean rollback.</text>
  </g>

  <rect x="0.5" y="0.5" width="899" height="303" rx="3" fill="none" stroke="#23272F" stroke-width="1"/>
</svg>
