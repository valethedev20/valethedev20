<svg xmlns="http://www.w3.org/2000/svg" width="900" height="276" viewBox="0 0 900 276" role="img" aria-label="Valentine Agam — Software Engineer and ICT Officer at Hospital Miri">
  <defs>
    <clipPath id="card-clip-light">
      <rect width="900" height="276" rx="14"/>
    </clipPath>
    <linearGradient id="grid-fade-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="grid-mask-light">
      <rect x="440" y="0" width="460" height="276" fill="url(#grid-fade-light)"/>
    </mask>
    <radialGradient id="ambient-glow-light" cx="78%" cy="48%" r="36%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pulse-grad-light" x1="500" y1="140" x2="852" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.25"/>
      <stop offset="32%" stop-color="#059669" stop-opacity="1"/>
      <stop offset="72%" stop-color="#059669" stop-opacity="1"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <style>
    .pulse-line {
      stroke-dasharray: 96 420;
      stroke-dashoffset: 516;
      animation: pulse-flow 4.2s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse-line {
        animation: none;
        stroke-dasharray: none;
        stroke-dashoffset: 0;
        opacity: 0.5;
      }
    }
    @keyframes pulse-flow {
      to { stroke-dashoffset: 0; }
    }
  </style>

  <g clip-path="url(#card-clip-light)">
    <rect width="900" height="276" fill="#FAFCFB"/>
    <g mask="url(#grid-mask-light)">
      <line x1="440" y1="0" x2="440" y2="276" stroke="#E7EEF4" stroke-width="1"/><line x1="468" y1="0" x2="468" y2="276" stroke="#E7EEF4" stroke-width="1"/><line x1="496" y1="0" x2="496" y2="276" stroke="#E7EEF4" stroke-width="1"/><line x1="524" y1="0" x2="524" y2="276" stroke="#E7EEF4" stroke-width="1"/><line x1="552" y1="0" x2="552" y2="276" stroke="#E7EEF4" stroke-width="1"/><line x1="580" y1="0" x2="580" y2="276" stroke="#E7EEF4" stroke-width="1"/><line x1="608" y1="0" x2="608" y2="276" stroke="#E7EEF4" stroke-width="1"/><line x1="636" y1="0" x2="636" y2="276" stroke="#E7EEF4" stroke-width="1"/><line x1="664" y1="0" x2="664" y2="276" stroke="#E7EEF4" stroke-width="1"/><line x1="692" y1="0" x2="692" y2="276" stroke="#E7EEF4" stroke-width="1"/><line x1="720" y1="0" x2="720" y2="276" stroke="#E7EEF4" stroke-width="1"/><line x1="748" y1="0" x2="748" y2="276" stroke="#E7EEF4" stroke-width="1"/><line x1="776" y1="0" x2="776" y2="276" stroke="#E7EEF4" stroke-width="1"/><line x1="804" y1="0" x2="804" y2="276" stroke="#E7EEF4" stroke-width="1"/><line x1="832" y1="0" x2="832" y2="276" stroke="#E7EEF4" stroke-width="1"/><line x1="860" y1="0" x2="860" y2="276" stroke="#E7EEF4" stroke-width="1"/><line x1="888" y1="0" x2="888" y2="276" stroke="#E7EEF4" stroke-width="1"/><line x1="440" y1="28" x2="900" y2="28" stroke="#E7EEF4" stroke-width="1"/><line x1="440" y1="56" x2="900" y2="56" stroke="#E7EEF4" stroke-width="1"/><line x1="440" y1="84" x2="900" y2="84" stroke="#E7EEF4" stroke-width="1"/><line x1="440" y1="112" x2="900" y2="112" stroke="#E7EEF4" stroke-width="1"/><line x1="440" y1="140" x2="900" y2="140" stroke="#E7EEF4" stroke-width="1"/><line x1="440" y1="168" x2="900" y2="168" stroke="#E7EEF4" stroke-width="1"/><line x1="440" y1="196" x2="900" y2="196" stroke="#E7EEF4" stroke-width="1"/><line x1="440" y1="224" x2="900" y2="224" stroke="#E7EEF4" stroke-width="1"/><line x1="440" y1="252" x2="900" y2="252" stroke="#E7EEF4" stroke-width="1"/>
    </g>
    <rect width="900" height="276" fill="url(#ambient-glow-light)"/>

    <!-- Left structural emerald bar -->
    <rect x="0" y="0" width="4" height="276" fill="#059669"/>

    <!-- Organization pill (symmetric padding) -->
    <rect x="48" y="34" width="312" height="30" rx="15" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <path d="M65 45 v8 M61 49 h8" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
    <text x="80" y="53.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#047857">Hospital Miri — Jabatan Kesihatan Sarawak</text>

    <!-- Display Name & Role -->
    <text x="48" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.1" fill="#0F172A">Valentine Agam</text>
    <text x="48" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Software Engineer &amp; ICT Officer (MySTEP)</text>

    <!-- Focus chips -->
    <rect x="48" y="182" width="92" height="30" rx="8" fill="#F3F6F9" stroke="#DCE4EC" stroke-width="1"/><text x="94.0" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#475569">Full-Stack</text><rect x="148" y="182" width="82" height="30" rx="8" fill="#F3F6F9" stroke="#DCE4EC" stroke-width="1"/><text x="189.0" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#475569">Backend</text><rect x="238" y="182" width="110" height="30" rx="8" fill="#F3F6F9" stroke="#DCE4EC" stroke-width="1"/><text x="293.0" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#475569">Data &amp; AI/ML</text>

    <!-- Location -->
    <g transform="translate(48, 232)" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 13.5 C7 13.5 12 9.4 12 5.8 A5 5 0 1 0 2 5.8 C2 9.4 7 13.5 7 13.5 Z"/>
      <circle cx="7" cy="5.8" r="1.6"/>
    </g>
    <text x="68" y="243.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">Sarawak, Malaysia</text>

    <!-- Right-side signature telemetry & systems pipeline diagram -->
    <g stroke="#D8E1EA" stroke-width="1.2" opacity="0.9">
      <path d="M510 42 h10 M515 37 v10"/>
      <path d="M846 42 h10 M851 37 v10"/>
      <path d="M510 232 h10 M515 227 v10"/>
      <path d="M846 232 h10 M851 227 v10"/>
    </g>

    <line x1="518" y1="92" x2="848" y2="92" stroke="#D8E1EA" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/>
    <line x1="518" y1="142" x2="848" y2="142" stroke="#D8E1EA" stroke-width="1" opacity="0.8"/>
    <line x1="518" y1="192" x2="848" y2="192" stroke="#D8E1EA" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/>

    <path d="M518 142 H554 L564 131 L574 152 L586 96 L598 176 L609 134 L618 142 H848"
          fill="none" stroke="url(#pulse-grad-light)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>

    <path class="pulse-line" d="M518 142 H554 L564 131 L574 152 L586 96 L598 176 L609 134 L618 142 H848"
          fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="662" cy="142" r="9" fill="#FAFCFB" stroke="#059669" stroke-width="2"/>
    <circle cx="662" cy="142" r="3.5" fill="#059669"/>
    <text x="662" y="172" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#475569">Build</text>

    <circle cx="742" cy="142" r="9" fill="#FAFCFB" stroke="#059669" stroke-width="2"/>
    <circle cx="742" cy="142" r="3.5" fill="#059669"/>
    <text x="742" y="172" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#475569">Maintain</text>

    <circle cx="822" cy="142" r="9" fill="#FAFCFB" stroke="#059669" stroke-width="2"/>
    <circle cx="822" cy="142" r="3.5" fill="#059669"/>
    <text x="822" y="172" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#475569">Report</text>

    <text x="840" y="66" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#64748B">internal-systems</text>
    <text x="840" y="218" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#64748B">valethedev20</text>
  </g>

  <rect x="0.5" y="0.5" width="899" height="275" rx="14" fill="none" stroke="#D8E1EA" stroke-width="1"/>
</svg>
