    <!-- Cardinal degree labels -->
    <text x="755" y="59" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="8.5" fill="#626975">000</text>
    <text x="860" y="155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="8.5" fill="#626975">090</text>
    <text x="755" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="8.5" fill="#626975">180</text>
    <text x="650" y="155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="8.5" fill="#626975">270</text>

