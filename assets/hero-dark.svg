    <text x="28" y="301" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#F4F5F7">Full-Stack / Backend / Data &amp; AI</text>

    <text x="356" y="282" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#626975">02 / domain</text>
    <text x="356" y="301" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#F4F5F7">Internal Hospital Systems</text>

    <text x="630" y="282" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#626975">03 / location</text>
