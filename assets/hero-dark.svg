<svg xmlns="http://www.w3.org/2000/svg" width="900" height="318" viewBox="0 0 900 318" role="img" aria-label="Valentine Agam — Software Engineer, Hospital Miri">
  <defs>
    <clipPath id="hero-clip-dark">
      <rect width="900" height="318" rx="3"/>
    </clipPath>
    <linearGradient id="metal-sheen-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101318"/>
      <stop offset="100%" stop-color="#0B0D10"/>
    </linearGradient>
    <linearGradient id="wedge-grad-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF4F00" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FF4F00" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="grain-dark" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <g clip-path="url(#hero-clip-dark)">
    <!-- CNC-milled anodized chassis -->
    <rect width="900" height="318" fill="url(#metal-sheen-dark)"/>
    <rect width="900" height="318" filter="url(#grain-dark)" opacity="0.032"/>

    <!-- Top & bottom recessed rails -->
    <rect x="0" y="0" width="900" height="38" fill="#0F1216"/>
    <rect x="0" y="262" width="900" height="56" fill="#0F1216"/>

    <!-- Top inner specular machined bevel -->
    <line x1="1" y1="1.5" x2="899" y2="1.5" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>

    <!-- Horizontal structural hairlines -->
    <line x1="0" y1="38.5" x2="900" y2="38.5" stroke="#23272F" stroke-width="1"/>
    <line x1="0" y1="262.5" x2="900" y2="262.5" stroke="#23272F" stroke-width="1"/>

    <!-- Continuous primary vertical structural axis -->
    <line x1="610.5" y1="0" x2="610.5" y2="318" stroke="#23272F" stroke-width="1"/>

    <!-- Secondary vertical rail dividers -->
    <line x1="168.5" y1="0" x2="168.5" y2="38" stroke="#23272F" stroke-width="1"/>
    <line x1="336.5" y1="262" x2="336.5" y2="318" stroke="#23272F" stroke-width="1"/>

    <!-- Top rail metadata with active breathing machined LED square -->
    <rect x="28" y="15.5" width="7" height="7" fill="#FF4F00">
      <animate attributeName="opacity" values="1;0.28;1" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <text x="45" y="23" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#F4F5F7">valethedev20</text>

    <text x="188" y="23" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#626975">HM-JKS / Hospital Miri, Sarawak</text>

    <text x="630" y="23" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#9BA2AE">04&#176;23&#8242;N  113&#176;59&#8242;E</text>
    <text x="872" y="23" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#626975">REV.26</text>

    <!-- Single-line monumental Swiss typography with smooth SMIL entrance -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.55s" begin="0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.55s" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1" begin="0s" fill="freeze"/>
      <text x="28" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-2.3" fill="#F4F5F7">Valentine Agam<tspan fill="#FF4F00" dx="2">.</tspan></text>
    </g>

    <!-- Quiet role line & machined scanning barcode -->
    <text x="30" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#9BA2AE">Software Engineer &#8212; ICT Officer (MySTEP)</text>
    <rect x="532" y="220" width="2" height="14" fill="#5E6674" opacity="0.35"><animate attributeName="opacity" values="0.35;0.95;0.35;0.35" keyTimes="0;0.14;0.3;1" dur="4.2s" begin="0.00s" repeatCount="indefinite"/></rect><rect x="539" y="220" width="3" height="14" fill="#5E6674" opacity="0.35"><animate attributeName="opacity" values="0.35;0.95;0.35;0.35" keyTimes="0;0.14;0.3;1" dur="4.2s" begin="0.14s" repeatCount="indefinite"/></rect><rect x="547" y="220" width="1" height="14" fill="#5E6674" opacity="0.35"><animate attributeName="opacity" values="0.35;0.95;0.35;0.35" keyTimes="0;0.14;0.3;1" dur="4.2s" begin="0.28s" repeatCount="indefinite"/></rect><rect x="554" y="220" width="1" height="14" fill="#5E6674" opacity="0.35"><animate attributeName="opacity" values="0.35;0.95;0.35;0.35" keyTimes="0;0.14;0.3;1" dur="4.2s" begin="0.42s" repeatCount="indefinite"/></rect><rect x="562" y="220" width="2" height="14" fill="#5E6674" opacity="0.35"><animate attributeName="opacity" values="0.35;0.95;0.35;0.35" keyTimes="0;0.14;0.3;1" dur="4.2s" begin="0.56s" repeatCount="indefinite"/></rect><rect x="569" y="220" width="1" height="14" fill="#5E6674" opacity="0.35"><animate attributeName="opacity" values="0.35;0.95;0.35;0.35" keyTimes="0;0.14;0.3;1" dur="4.2s" begin="0.70s" repeatCount="indefinite"/></rect>

