troke="#313640" stroke-width="0.8"/><line x1="-76.6" y1="-24.9" x2="-79.9" y2="-26.0" stroke="#313640" stroke-width="0.8"/><line x1="-73.5" y1="-32.7" x2="-76.7" y2="-34.2" stroke="#313640" stroke-width="0.8"/><line x1="-66.7" y1="-38.5" x2="-72.7" y2="-42.0" stroke="#5E6674" stroke-width="1.1"/><line x1="-65.1" y1="-47.3" x2="-68.0" y2="-49.4" stroke="#313640" stroke-width="0.8"/><line x1="-59.8" y1="-53.9" x2="-62.4" y2="-56.2" stroke="#313640" stroke-width="0.8"/><line x1="-53.9" y1="-59.8" x2="-56.2" y2="-62.4" stroke="#313640" stroke-width="0.8"/><line x1="-47.3" y1="-65.1" x2="-49.4" y2="-68.0" stroke="#313640" stroke-width="0.8"/><line x1="-38.5" y1="-66.7" x2="-42.0" y2="-72.7" stroke="#5E6674" stroke-width="1.1"/><line x1="-32.7" y1="-73.5" x2="-34.2" y2="-76.7" stroke="#313640" stroke-width="0.8"/><line x1="-24.9" y1="-76.6" x2="-26.0" y2="-79.9" stroke="#313640" stroke-width="0.8"/><line x1="-16.7" y1="-78.7" x2="-17.5" y2="-82.2" stroke="#313640" stroke-width="0.8"/><line x1="-8.4" y1="-80.1" x2="-8.8" y2="-83.5" stroke="#313640" stroke-width="0.8"/>

      <!-- Counter-rotating mid azimuth dashed ring -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="32s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="62" fill="none" stroke="#5E6674" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="2 5"/>
        <circle cx="0" cy="-62" r="2.1" fill="#9BA2AE"/>
        <circle cx="0" cy="62" r="1.5" fill="#5E6674"/>
      </g>

      <!-- Stepping Swiss escapement inner reticle (ticks every 1s) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" calcMode="discrete" values="0;30;60;90;120;150;180;210;240;270;300;330" dur="12s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="28" fill="none" stroke="#262B34" stroke-width="1"/>
        <line x1="0" y1="-33" x2="0" y2="-23" stroke="#9BA2AE" stroke-width="1.3"/>
        <line x1="32" y1="0" x2="24" y2="0" stroke="#5E6674" stroke-width="1"/>
        <line x1="0" y1="32" x2="0" y2="24" stroke="#5E6674" stroke-width="1"/>
        <line x1="-32" y1="0" x2="-24" y2="0" stroke="#5E6674" stroke-width="1"/>
      </g>

      <!-- Primary sweeping mechanical hand + subtle trailing sector -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="35" to="395" dur="12s" repeatCount="indefinite"/>
        <path d="M 0 0 L -39.2 -62.8 A 74 74 0 0 1 0.0 -74.0 Z" fill="url(#wedge-grad-dark)"/>
        <line x1="0" y1="16" x2="0" y2="-77" stroke="#9BA2AE" stroke-width="1.2"/>
        <line x1="0" y1="-55" x2="0" y2="-81" stroke="#FF4F00" stroke-width="2.1"/>
      </g>

      <!-- Machined center pivot -->
      <circle cx="0" cy="0" r="5" fill="#0B0D10" stroke="#9BA2AE" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="1.8" fill="#FF4F00"/>
