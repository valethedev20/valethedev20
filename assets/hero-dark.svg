      <circle cx="0" cy="0" r="84" fill="none" stroke="#262B34" stroke-width="1"/>
      <line x1="0.0" y1="-73.0" x2="0.0" y2="-84.0" stroke="#FF4F00" stroke-width="1.8"/><line x1="8.4" y1="-80.1" x2="8.8" y2="-83.5" stroke="#313640" stroke-width="0.8"/><line x1="16.7" y1="-78.7" x2="17.5" y2="-82.2" stroke="#313640" stroke-width="0.8"/><line x1="24.9" y1="-76.6" x2="26.0" y2="-79.9" stroke="#313640" stroke-width="0.8"/><line x1="32.7" y1="-73.5" x2="34.2" y2="-76.7" stroke="#313640" stroke-width="0.8"/><line x1="38.5" y1="-66.7" x2="42.0" y2="-72.7" stroke="#5E6674" stroke-width="1.1"/><line x1="47.3" y1="-65.1" x2="49.4" y2="-68.0" stroke="#313640" stroke-width="0.8"/><line x1="53.9" y1="-59.8" x2="56.2" y2="-62.4" stroke="#313640" stroke-width="0.8"/><line x1="59.8" y1="-53.9" x2="62.4" y2="-56.2" stroke="#313640" stroke-width="0.8"/><line x1="65.1" y1="-47.3" x2="68.0" y2="-49.4" stroke="#313640" stroke-width="0.8"/><line x1="66.7" y1="-38.5" x2="72.7" y2="-42.0" stroke="#5E6674" stroke-width="1.1"/><line x1="73.5" y1="-32.7" x2="76.7" y2="-34.2" stroke="#313640" stroke-width="0.8"/><line x1="76.6" y1="-24.9" x2="79.9" y2="-26.0" stroke="#313640" stroke-width="0.8"/><line x1="78.7" y1="-16.7" x2="82.2" y2="-17.5" stroke="#313640" stroke-width="0.8"/><line x1="80.1" y1="-8.4" x2="83.5" y2="-8.8" stroke="#313640" stroke-width="0.8"/><line x1="73.0" y1="0.0" x2="84.0" y2="0.0" stroke="#9BA2AE" stroke-width="1.3"/><line x1="80.1" y1="8.4" x2="83.5" y2="8.8" stroke="#313640" stroke-width="0.8"/><line x1="78.7" y1="16.7" x2="82.2" y2="17.5" stroke="#313640" stroke-width="0.8"/><line x1="76.6" y1="24.9" x2="79.9" y2="26.0" stroke="#313640" stroke-width="0.8"/><line x1="73.5" y1="32.7" x2="76.7" y2="34.2" stroke="#313640" stroke-width="0.8"/><line x1="66.7" y1="38.5" x2="72.7" y2="42.0" stroke="#5E6674" stroke-width="1.1"/><line x1="65.1" y1="47.3" x2="68.0" y2="49.4" stroke="#313640" stroke-width="0.8"/><line x1="59.8" y1="53.9" x2="62.4" y2="56.2" stroke="#313640" stroke-width="0.8"/><line x1="53.9" y1="59.8" x2="56.2" y2="62.4" stroke="#313640" st