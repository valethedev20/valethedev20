<svg xmlns="http://www.w3.org/2000/svg" width="900" height="318" viewBox="0 0 900 318" role="img" aria-label="Valentine Agam — Software Engineer, Hospital Miri">
  <defs>
    <clipPath id="hero-clip-light">
      <rect width="900" height="318" rx="3"/>
    </clipPath>
    <linearGradient id="metal-sheen-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="100%" stop-color="#F5F4F0"/>
    </linearGradient>
    <filter id="grain-light" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <style>
    .dial-hand {
      transform-origin: 755px 152px;
      animation: sweep 48s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .dial-hand {
        animation: none;
        transform: rotate(38deg);
      }
    }
    @keyframes sweep {
      from { transform: rotate(38deg); }
      to { transform: rotate(398deg); }
    }
  </style>

  <g clip-path="url(#hero-clip-light)">
    <!-- CNC-milled anodized chassis -->
    <rect width="900" height="318" fill="url(#metal-sheen-light)"/>
    <!-- Subtle brushed aluminum micro-grain -->
    <rect width="900" height="318" filter="url(#grain-light)" opacity="0.025"/>

    <!-- Top & bottom recessed rails -->
    <rect x="0" y="0" width="900" height="38" fill="#ECEAE3"/>
    <rect x="0" y="262" width="900" height="56" fill="#ECEAE3"/>

    <!-- Top inner specular machined bevel -->
